<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div class="admin-shell">
    <div class="admin-topbar">
      <div class="admin-topbar-inner">
        <a href="/" class="nav-logo"><span class="bracket">~/</span>admin</a>
        <div style="display:flex; gap: 14px; align-items:center;">
          <a th:href="@{/admin/dashboard}" class="nav-cta">Dashboard</a>
          <form th:action="@{/admin/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-outline btn-sm">Log out</button>
          </form>
        </div>
      </div>
    </div>

    <div class="admin-main">
      <a th:href="@{/admin/dashboard}" class="back-link">← back to dashboard</a>

      <div class="admin-header">
        <div>
          <h1>Messages</h1>
          <p>Everything submitted through the contact form on the site.</p>
        </div>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table" th:if="${not #lists.isEmpty(messages)}">
          <thead>
            <tr>
              <th>From</th>
              <th>Message</th>
              <th>Received</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="msg : ${messages}">
              <td class="title-cell">
                <div th:text="${msg.name}">Name</div>
                <div class="mono" style="color: var(--text-dim); font-size: 0.78rem; margin-top: 4px;" th:text="${msg.email}">email</div>
              </td>
              <td th:text="${msg.message}">Message text</td>
              <td class="mono" th:text="${#temporals.format(msg.submittedAt, 'dd MMM yyyy, HH:mm')}">date</td>
            </tr>
          </tbody>
        </table>

        <div class="empty-state" th:if="${#lists.isEmpty(messages)}" style="border:none;">
          // no messages yet
        </div>
      </div>
    </div>
  </div>
</body>
</html>
