<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div class="admin-shell">
    <div class="admin-topbar">
      <div class="admin-topbar-inner">
        <a href="/" class="nav-logo"><span class="bracket">~/</span>admin</a>
        <div style="display:flex; gap: 14px; align-items:center;">
          <a th:href="@{/admin/messages}" class="nav-cta">Messages</a>
          <form th:action="@{/admin/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-outline btn-sm">Log out</button>
          </form>
        </div>
      </div>
    </div>

    <div class="admin-main">
      <div class="admin-flash" th:if="${saved}">✓ project saved</div>
      <div class="admin-flash" th:if="${deleted}">✓ project deleted</div>

      <div class="admin-header">
        <div>
          <h1>Projects</h1>
          <p>Add, edit or remove what shows up on the public site.</p>
        </div>
        <a th:href="@{/admin/projects/new}" class="btn btn-primary">+ Add project</a>
      </div>

      <div class="admin-stats">
        <div class="stat-card">
          <div class="stat-num" th:text="${#lists.size(projects)}">0</div>
          <div class="stat-label">projects live</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" th:text="${messageCount}">0</div>
          <div class="stat-label">contact messages</div>
        </div>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table" th:if="${not #lists.isEmpty(projects)}">
          <thead>
            <tr>
              <th>Title</th>
              <th>Tech stack</th>
              <th>Order</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="project : ${projects}">
              <td class="title-cell" th:text="${project.title}">Title</td>
              <td th:text="${project.techStack}">Tech stack</td>
              <td th:text="${project.displayOrder}">0</td>
              <td>
                <div class="row-actions">
                  <a th:href="@{'/admin/projects/edit/' + ${project.id}}" class="btn btn-outline btn-sm">Edit</a>
                  <form th:action="@{'/admin/projects/delete/' + ${project.id}}" method="post"
                        onsubmit="return confirm('Delete this project? This can\'t be undone.');" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

        <div class="empty-state" th:if="${#lists.isEmpty(projects)}" style="border:none;">
          // no projects yet — click "Add project" to create your first one
        </div>
      </div>
    </div>
  </div>

  <script th:src="@{/js/script.js}"></script>
</body>
</html>
