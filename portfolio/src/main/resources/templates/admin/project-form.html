<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${isNew} ? 'Add Project — Admin' : 'Edit Project — Admin'">Project — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div class="admin-shell">
    <div class="admin-topbar">
      <div class="admin-topbar-inner">
        <a href="/" class="nav-logo"><span class="bracket">~/</span>admin</a>
        <form th:action="@{/admin/logout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="btn btn-outline btn-sm">Log out</button>
        </form>
      </div>
    </div>

    <div class="admin-main">
      <a th:href="@{/admin/dashboard}" class="back-link">← back to dashboard</a>

      <div class="admin-header">
        <div>
          <h1 th:text="${isNew} ? 'Add project' : 'Edit project'">Add project</h1>
          <p>This is exactly what shows up in the Projects section on the public site.</p>
        </div>
      </div>

      <div class="admin-form-card">
        <form th:action="@{/admin/projects/save}" th:object="${project}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <input type="hidden" th:field="*{id}" />

          <div class="field">
            <label for="title">title</label>
            <input type="text" id="title" th:field="*{title}" required placeholder="e.g. Restaurant Management System" />
          </div>

          <div class="field">
            <label for="description">description</label>
            <textarea id="description" th:field="*{description}" required placeholder="What it does, how it's built, what problem it solves."></textarea>
          </div>

          <div class="field">
            <label for="techStack">tech stack (comma-separated)</label>
            <input type="text" id="techStack" th:field="*{techStack}" placeholder="Java, Spring Boot, MySQL" />
          </div>

          <div class="form-row">
            <div class="field">
              <label for="githubLink">github link (optional)</label>
              <input type="url" id="githubLink" th:field="*{githubLink}" placeholder="https://github.com/username/repo" />
            </div>
            <div class="field">
              <label for="liveLink">live link (optional)</label>
              <input type="url" id="liveLink" th:field="*{liveLink}" placeholder="https://your-demo-url.com" />
            </div>
          </div>

          <div class="field" style="max-width: 200px;">
            <label for="displayOrder">display order</label>
            <input type="number" id="displayOrder" th:field="*{displayOrder}" placeholder="1" />
          </div>

          <div class="admin-form-actions">
            <button type="submit" class="btn btn-primary">Save project</button>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
