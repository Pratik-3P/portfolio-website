spring.application.name=portfolio

# ---------------------------------------------------------
# MySQL Database
# Create a database first (or let createDatabaseIfNotExist handle it):
#   CREATE DATABASE portfolio_db;
# Then update the username/password below to match your MySQL setup.
# ---------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------
# Admin login (used to add/edit/delete projects at /admin)
# CHANGE THIS PASSWORD before you deploy this anywhere public.
# ---------------------------------------------------------
admin.username=admin
admin.password=changeme123

server.port=8080
